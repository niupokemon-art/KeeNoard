name: Build Vial Firmware with KeyPeek

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest
    steps:
      - name: Checkout Vial-QMK
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          submodules: recursive
          path: vial-qmk

      - name: Checkout Keyboard Repo
        uses: actions/checkout@v4
        with:
          path: my-keyboard

      - name: Add KeyPeek Module & Fix Function Declaration
        run: |
          cd vial-qmk
          mkdir -p modules
          git clone --recursive https://github.com/srwi/qmk-modules.git modules/srwi
          
          # 在 keypeek_layer_notify.c 顶部补充函数声明并放宽警告限制
          sed -i '1i\void raw_hid_receive_user(uint8_t *data, uint8_t length);' modules/srwi/keypeek_layer_notify/keypeek_layer_notify.c
          
          cp -r ../my-keyboard/firmware/keenoard keyboards/

      - name: Compile Left & Right Firmware
        run: |
          cd vial-qmk
          qmk compile -kb keenoard -km leftboard_vial EXTRAFLAGS="-Wno-error=implicit-function-declaration"
          qmk compile -kb keenoard -km rightboard_vial EXTRAFLAGS="-Wno-error=implicit-function-declaration"

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keenoard-keypeek-uf2
          path: |
            vial-qmk/*.uf2
            vial-qmk/*.bin
            vial-qmk/*.hex
