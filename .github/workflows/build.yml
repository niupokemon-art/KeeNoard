name: Build Vial Firmware with KeyPeek

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest
    steps:
      - name: Checkout Vial-QMK
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          submodules: recursive
          path: vial-qmk

      - name: Checkout Keyboard Repo
        uses: actions/checkout@v4
        with:
          path: my-keyboard

      - name: Add KeyPeek Module & Fix Compilation
        run: |
          cd vial-qmk
          mkdir -p modules
          git clone --recursive https://github.com/srwi/qmk-modules.git modules/srwi

          # 拷贝键盘源码
          cp -r ../my-keyboard/firmware/keenoard keyboards/

          # 1. 在 keypeek 源码顶部包含 raw_hid.h 头文件以提供函数声明
          sed -i '1i\#include "raw_hid.h"' modules/srwi/keypeek_layer_notify/keypeek_layer_notify.c

          # 2. 在键盘的 rules.mk 中加入忽略隐式函数声明错误的参数（双重保险）
          echo 'EXTRAFLAGS += -Wno-error=implicit-function-declaration' >> keyboards/keenoard/rules.mk

      - name: Compile Left & Right Firmware
        run: |
          cd vial-qmk
          qmk compile -kb keenoard -km leftboard_vial
          qmk compile -kb keenoard -km rightboard_vial

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keenoard-keypeek-uf2
          path: |
            vial-qmk/*.uf2
            vial-qmk/*.bin
            vial-qmk/*.hex
